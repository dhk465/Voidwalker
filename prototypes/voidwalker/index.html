<script>
'use strict';
// Voidwalker: a blob of void holds the bottom of a rift; its deck of nature cards is its ammo.
// Between adventures, at the Rift Altar, the collection grows (Void Rite), cards fuse (Forge),
// and the next deck is chosen for the omen ahead.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value });
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Voidwalker';
const CONTROLS = ['WASD or Arrows: move along the rift floor', 'Mouse: aim  ·  hold left button: fire',
  'Q: auto-fire on or off', 'Space or P: pause  ·  M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_R = 1;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1); VIEW_R = r;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function wrapText(s, x, y, maxW, size, c, align = 'center') {
  ctx.font = `${size}px ${FONT}`; const words = String(s).split(' '); let line = '', yy = y;
  for (const wd of words) { const tst = line ? line + ' ' + wd : wd; if (ctx.measureText(tst).width > maxW && line) { text(line, x, yy, size, c, align); line = wd; yy += size + 4; ctx.font = `${size}px ${FONT}`; } else line = tst; }
  if (line) text(line, x, yy, size, c, align);
  return yy;
}

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const held = (...codes) => codes.some(c => down.has(c));
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
const mouse = { x: W / 2, y: 0, down: false, moved: false, click: null };
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointermove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; });
canvas.addEventListener('pointerdown', e => { startAudio(); const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; if (e.button === 0) { mouse.down = true; mouse.click = p; } });
addEventListener('pointerup', () => { mouse.down = false; });

addEventListener('blur', () => { down.clear(); mouse.down = false; });
const inBox = (p, x, y, w, h) => !!p && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }

function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));

// ---- Natures, recipes, cards -----------------------------------------------------------------
const BASE = NATURES.base, RECIPES = NATURES.recipes, DISCOVER = NATURES.discover, OMENS = NATURES.omens;

function hexMix(a, b) {

  const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round((v + y[i]) / 2).toString(16).padStart(2, '0')).join('');

  if (r.color) continue;

    t: 0, score: 0, gained: '', phase: intro ? 'intro' : 'start', introT: 0, startT: 1.2,
    omen, depth: intro ? 0 : meta.depth, form, tr, prevail: intro ? null : meta.prevail,
    statusMul: tr.status * (omen.status || 1),
    voidMul: (omen.void || 1) * (1 + tune.depth_void * (intro ? 0 : meta.depth)),
    hpMul: (omen.hp || 1) * (1 + tune.depth_hp * (intro ? 0 : meta.depth)),
    player: { x: RCX, y: 670, iframe: 0, aim: -Math.PI / 2, still: true },
    maxEnergy: tune.max_energy + tr.max_energy, energy: tune.max_energy + tr.max_energy, voidE: 0, kills: 0, ward: 0,
    deck: [], draw: [], discard: [], fireCd: 0, reshuffleT: 0, autoFire: false, nextId: 1,
    stage: 1, waveN: 1, wave: null, clearT: 0, waveHurt: false, waveLeak: false,
    enemies: [], matter: [], bolts: [], globs: [], motes: [], petals: [], fields: [], parts: [], floaters: [],
    walls: [], decoys: [], allies: [], meteors: [], mines: [], beams: [], arcs: [], echoes: [],
    warnings: [], webs: [], strikes: [], bigs: [], card: null, tide: 'mixed', met: new Set(),

const cardById = id => state.deck.find(c => c.id === id);
function rebuildPiles() { state.draw = shuffle(state.deck.map(c => c.id)); state.discard = []; }

// ---- Discoveries: achievements kept between adventures ------------------------------------------
function track(stat, n = 1) {
  meta.stats[stat] = (meta.stats[stat] || 0) + n;
  for (const [nat, d] of Object.entries(DISCOVER)) {
    if (d.stat !== stat || meta.discovered.includes(nat) || !meta.innate) continue;
    if (meta.stats[stat] >= d.n) discover(nat);
  }
}
function discover(nat) {
  meta.discovered.push(nat);
  addCards(stackKey([nat], 1), tune.discovery_copies);
  meta.bank += tune.discovery_bonus;
  if (state) state.found.push(nat);
  saveMeta();
  floatText(`${BASE[nat].name.toUpperCase()} FOUND`, RCX, 220, BASE[nat].color, 34, 3);
  tone(392, 0.25, 'sine', 0.2); tone(588, 0.5, 'sine', 0.15, 1.5);

}

// ---- The hive and the matter: waves built from beats ------------------------------------------------
// Each wave: a nature tide, the debut of kinds not yet met this adventure (a name card the first time
// ever), then beats (patterns) drawn from the kinds already met, and a mini-boss or boss where the run calls for one.
const YB = window.YBASOGS, MT = window.MATTER;
const MINIONS = Object.keys(YB).filter(k => YB[k].role === 'minion');

const isBig = e => !!e.big;
const reach = () => state.stage + (state.depth >= 2 ? 1 : 0);

}
function pickW(list, wfn) { const tot = list.reduce((a, k) => a + wfn(k), 0); let r = rng() * tot; for (const k of list) { r -= wfn(k); if (r <= 0) return k; } return list[list.length - 1]; }
const TIDES = { void: { name: 'Void tide', color: '#b9a6ff' }, mixed: { name: 'Mixed tide', color: '#cfc6e6' }, surge: { name: 'Nature surge', color: '#ffd27a' } };

  return r < w[0] ? 'void' : r < w[0] + w[1] ? 'mixed' : 'surge';
}
function natureShare() { return state.tide === 'void' ? 0.05 : state.tide === 'surge' ? 0.7 : Math.min(0.9, tune.nature_chance + tune.nature_chance_step * (state.stage - 1)); }
function rollNature() {

}
function natMult(ns, n) {
  if (!n || !ns || !ns.length) return 1;

}

      cardSigil(s, r.x + 16, r.y + 14, 9); text(`${cardName(s)}  x${s.n}`, r.x + 34, r.y + 14, 15, cardColor(s), 'left'); if (hv) text('remove', r.x + 264, r.y + 14, 13, '#ff9a9a', 'right'); });
    const n = dominantNature(loadoutCards()), col = n ? BASE[n].color : '#b9a6ff';
    text('YOUR FORM', R, 418, 15, '#e9dcff', 'left', 'bold');
    drawForm(n ? BASE[n].form : 'blob', R + 44, 472, col, t, 1.5);
    text(n ? `${BASE[n].formName}, shaped by ${BASE[n].name}` : 'Shapeless', R + 100, 452, 18, col, 'left', 'bold');
    wrapText(n ? BASE[n].traitText : 'Add nature cards: the nature most present in the deck shapes you.', R + 100, 478, 440, 15, '#cfc6e6', 'left');
    const om = OMENS[meta.omen] || OMENS.calm;
    text('OMEN', R, 512, 15, '#e9dcff', 'left', 'bold'); text(om.name, R + 60, 512, 17, '#ffd27a', 'left', 'bold'); text(om.says, R + 60, 534, 14, '#cfc6e6', 'left');
    if (meta.prevail) { const pv = BASE[meta.prevail], op = BASE[pv.opposite];
      text('NATURE', R, 560, 15, '#e9dcff', 'left', 'bold'); sigil(meta.prevail, R + 70, 560, 8, pv.color); text(`${pv.name} prevails`, R + 84, 560, 16, pv.color, 'left', 'bold');
      text(`${op.name} bolts deal x${tune.opposite_mult} to it, ${pv.name} bolts only x${tune.same_mult}`, R + 220, 560, 13, '#cfc6e6', 'left'); }
    text('DEPTH', R, 588, 15, '#e9dcff', 'left', 'bold');
    text(`+${Math.round(tune.depth_hp * meta.depth * 100)}% Ybasog life, +${Math.round(tune.depth_void * meta.depth * 100)}% void energy`, R + 60, 588, 14, '#9d92bb', 'left');
    abutton(1004, 573, 34, 30, '-', '', '#d8c8ff', meta.depth > 0); text(`${meta.depth}`, 1074, 588, 20, '#efe6ff', 'center', 'bold'); abutton(1110, 573, 34, 30, '+', '', '#d8c8ff', meta.depth < meta.maxDepth);
    abutton(R, 614, 560, 68, 'Begin the adventure  (Enter)', deckCount() < tune.deck_min ? `Add ${tune.deck_min - deckCount()} more card(s) first` : 'Three stages, the Mother at the end. Void energy you gather is banked.', '#c8ffe8', deckCount() >= tune.deck_min);
    msgY = 702;
  } else if (altar.tab === 'rite') {
    text('THE VOID RITE', R, 160, 18, '#e9dcff', 'left', 'bold');
    wrapText('Spend banked void energy to call cards from the natures you have discovered. Twins fuse into higher levels at the Forge.', R, 188, 560, 15, '#cfc6e6', 'left');
    text('FOCUS (optional): click a nature to call it more often', R, 234, 14, '#9d92bb', 'left');
    meta.discovered.forEach((n, i) => { const f = focusTile(i), on = meta.focus === n;
      roundRect(f.cx - 32, f.cy - 26, 64, 52, 8); ctx.fillStyle = on ? '#2a1f45' : '#0f0b18'; ctx.fill(); ctx.strokeStyle = on ? BASE[n].color : '#2a2140'; ctx.lineWidth = on ? 2 : 1; ctx.stroke();
      sigil(n, f.cx, f.cy - 6, 11, BASE[n].color); text(BASE[n].name, f.cx, f.cy + 16, 12, BASE[n].color); });
    const per = tune.rite_cost + (meta.focus ? tune.focus_cost : 0), grand = tune.grand_rite_cost + (meta.focus ? tune.focus_cost * 10 : 0);
    abutton(R, 380, 270, 60, `One rite: ${per}`, meta.focus ? `focused on ${BASE[meta.focus].name}` : 'any discovered nature', '#d8c8ff', meta.bank >= per);
    abutton(970, 380, 270, 60, `Ten rites: ${grand}`, 'ten cards for the price of nine', '#ffd27a', meta.bank >= grand);
    text(`Rare (level II) ${Math.round(tune.rare_chance * 100)}%  ·  Mythic (already fused) ${Math.round(tune.mythic_chance * 100)}%  ·  a mythic is certain within ${Math.max(1, tune.mythic_pity - meta.pity)} draws`, R, 456, 13, '#9d92bb', 'left');
    altar.reveal.forEach((r, i) => { const x = R + (i % 5) * 112, y = 476 + Math.floor(i / 5) * 112, w = 100, h = 100;
      const glow = r.rar === 'mythic' ? '#ffd27a' : r.rar === 'rare' ? '#9ad7ff' : null;
      if (glow) { ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = CHEAP ? 0 : 22; roundRect(x - 3, y - 3, w + 6, h + 6, 10); ctx.strokeStyle = glow; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
      drawCard(r, x, y, w, h, false, false, r.isNew ? { s: 'NEW', bg: '#ffd27a', c: '#1a1229' } : null); });
    msgY = altar.reveal.length > 5 ? 2000 : 600;
  } else if (altar.tab === 'forge') {
    text('THE FORGE', R, 160, 18, '#e9dcff', 'left', 'bold');
    wrapText('Two cards become one. New fusions fill the Codex and pay a bounty. Twins rise a level. Opposites annul: a way to thin your collection, with a little void energy back.', R, 188, 560, 15, '#cfc6e6', 'left');
    const sl = [altar.sel[0], altar.sel[1]];
    sl.forEach((sk, i) => { const x = R + i * 200; roundRect(x, 250, 120, 130, 8); ctx.strokeStyle = '#3b3350'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
      if (sk) drawCard(parseStack(sk), x, 250, 120, 130, false, true); else text('choose', x + 60, 315, 15, '#6d6488'); });
    text('+', R + 160, 315, 30, '#9d92bb'); text('=', R + 360, 315, 30, '#9d92bb');
    let sub = 'Choose two cards';
    if (altar.sel.length === 2) {
      const a = parseStack(sl[0]), b = parseStack(sl[1]), r = fuseResult(a, b);
      if (r.kind === 'void') { sub = 'Opposites: both return to the void'; ctx.save(); ctx.translate(R + 460, 315); ctx.beginPath(); for (let i = 0; i <= 14; i++) { const q = i / 14 * 6.283, rr = 34 + Math.sin(q * 3 + t * 3) * 4; ctx.lineTo(Math.cos(q) * rr, Math.sin(q) * rr); } ctx.fillStyle = '#000'; ctx.fill(); glowStroke('#b9a6ff', 14, 2); ctx.restore(); }
      else if (r.kind === 'new' && isFusionKey(keyOf(r.union)) && !meta.fusions.includes(keyOf(r.union))) { sub = 'An unknown fusion. Forge it to find out.'; roundRect(R + 400, 250, 120, 130, 8); ctx.fillStyle = '#0e0a18'; ctx.fill(); glowStroke(RECIPES[keyOf(r.union)].color, 16, 2); text('?', R + 460, 312, 48, '#efe6ff', 'center', 'bold'); }
      else if (r.kind === 'new' || r.kind === 'level') { const c = { natures: r.union, level: r.level || 1 }; drawCard(c, R + 400, 250, 120, 130, false, false); sub = `Becomes ${cardName(c)}`; }
      else sub = r.kind === 'maxed' ? 'Already at its highest level' : 'Unstable: not yet known';
    }
    abutton(R, 400, 560, 56, `Fuse: ${tune.fuse_cost} void energy`, sub, '#ffd27a', altar.sel.length === 2 && meta.bank >= tune.fuse_cost);
    abutton(R, 470, 270, 34, 'Clear the choice', '', '#9d92bb', altar.sel.length > 0);
    text(`Fusions found: ${meta.fusions.length} / ${FUSION_KEYS.length}`, R, 536, 16, '#e9dcff', 'left', 'bold');
    text('A Void Bolt melts into any nature card: a way to trim plain bolts.', R, 562, 14, '#9d92bb', 'left');
    text('Three- and four-nature fusions: not yet known', R, 586, 14, '#6d6488', 'left');
    msgY = 640;
  } else if (altar.tab === 'codex') {
    text(`THE CODEX   ${meta.fusions.length} / ${FUSION_KEYS.length} fusions`, R, 160, 18, '#e9dcff', 'left', 'bold');
    let hi = null;
    FUSION_KEYS.forEach((k, i) => { const x = R + (i % 12) * 46, y = 180 + Math.floor(i / 12) * 46, known = meta.fusions.includes(k), ns = k.split('+'), rec = RECIPES[k];
      roundRect(x, y, 40, 40, 6); ctx.fillStyle = known ? '#140f22' : '#0a0812'; ctx.fill(); ctx.strokeStyle = known ? rec.color : '#221b33'; ctx.lineWidth = known ? 1.6 : 1; ctx.stroke();
      const canMake = ns.every(n => meta.discovered.includes(n));
      if (known) cardSigil({ natures: ns, level: 1 }, x + 20, y + 20, 13); else text('?', x + 20, y + 21, 16, canMake ? '#7d7398' : '#3a3150', 'center', 'bold');
      if (inBox(mouse, x, y, 40, 40)) hi = { k, known, canMake }; });
    if (hi) { const rec = RECIPES[hi.k], ns = hi.k.split('+');
      text(hi.known ? rec.name : 'Unknown fusion', R, 524, 20, hi.known ? rec.color : '#9d92bb', 'left', 'bold');
      text(hi.known ? `${BASE[ns[0]].name} + ${BASE[ns[1]].name}` : hi.canMake ? 'You know both of its natures. Try the Forge.' : 'One of its natures is still undiscovered.', R, 550, 15, '#cfc6e6', 'left');
      if (hi.known) wrapText(rec.says, R, 574, 560, 15, '#cfc6e6', 'left'); }
    else text('Point at a cell to read it. A brighter ? can be forged with natures you know.', R, 540, 15, '#8f84ad', 'left');
    text('Opposites never fuse: Pride and Humility, Greed and Charity, Wrath and Patience,', R, 622, 14, '#b9a6ff', 'left');
    text('Envy and Kindness, Lust and Chastity, Gluttony and Temperance, Sloth and Diligence.', R, 642, 14, '#b9a6ff', 'left');
    msgY = 2000;
  } else if (altar.tab === 'found') {
    text(`DISCOVERIES   ${meta.discovered.length} / 14 natures`, R, 160, 18, '#e9dcff', 'left', 'bold');
    NIDS.forEach((n, i) => { const x = R + (i % 2) * 284, y = 200 + Math.floor(i / 2) * 64, b = BASE[n], got = meta.discovered.includes(n), d = DISCOVER[n];
      roundRect(x, y - 24, 274, 56, 8); ctx.fillStyle = got ? '#130e20' : '#0a0812'; ctx.fill(); ctx.strokeStyle = got ? b.color : '#2a2140'; ctx.lineWidth = 1; ctx.stroke();
      sigil(n, x + 22, y + 4, 12, got ? b.color : '#4a4060');
      text(got ? `${b.name}  ·  ${b.element}` : `${b.name}  ·  undiscovered`, x + 44, y - 8, 15, got ? b.color : '#8f84ad', 'left', 'bold');
      if (n === meta.innate) text(`your innate nature  ·  ${b.formName}`, x + 44, y + 14, 13, '#cfc6e6', 'left');
      else if (got) wrapText(`${b.formName}: ${b.traitText}`, x + 44, y + 10, 222, 12, '#9d92bb', 'left');
      else { const have = Math.min(d.n, meta.stats[d.stat] || 0); wrapText(`${d.text} (${have}/${d.n})`, x + 44, y + 12, 222, 12, '#b8acd6', 'left'); } });
    abutton(980, 664, 260, 34, 'Forget everything', '', '#ff9a9a', true);
    msgY = 2000; if (altar.msg.startsWith('Click again')) text(altar.msg, R, 681, 14, altar.msgC, 'left');
  }
  if (msgY < H) wrapText(altar.msg, R, msgY, 560, 14, altar.msgC, 'left');
}

// ---- Scenes ------------------------------------------------------------------------------------
function drawEnd(won) {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(RL, 0, RR - RL, H);
  text(won ? 'THE MOTHER FALLS' : 'YOUR LIGHT GOES OUT', RCX, 200, 44, won ? '#efe6ff' : '#ffb0b0', 'center', 'bold');
  ctx.save(); ctx.translate(RCX - 62, 290); ctx.fillStyle = '#d8c8ff'; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(10, 0); ctx.lineTo(0, 16); ctx.lineTo(-10, 0); ctx.fill(); ctx.restore();
  text(`+${state.banked}`, RCX - 40, 292, 44, '#d8c8ff', 'left', 'bold');
  state.found.forEach((n, i) => { const x = RCX + (i - (state.found.length - 1) / 2) * 60; sigil(n, x, 380, 16, BASE[n].color); });
  if (won && meta.maxDepth > state.depth) text(`DEPTH ${state.depth + 1}`, RCX, 440, 22, '#ffd27a', 'center', 'bold');
  text('Enter', RCX, 560, 22, '#fff', 'center', 'bold');
}
const scenes = {
  figures: { // ?scene=figures: every Ybasog; &page=2: matter and the blob's forms
    update(dt) { state.t += dt; },
    draw() {
      clear('#000'); const t = state.t, page = params.get('page') === '2' ? 2 : 1;
      text(page === 1 ? 'Voidwalker: every Ybasog' : 'Voidwalker: falling matter and the blob\'s forms', W / 2, 20, 20, '#e9dcff', 'center', 'bold');
      if (page === 1) {
        const ks = Object.keys(YB).filter(k => YB[k].role !== 'boss');
        ks.forEach((k, i) => { const d = YB[k], x = 80 + (i % 8) * 160, y = 82 + Math.floor(i / 8) * 112, sc = d.role === 'mini' ? 0.62 : 1;
          ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); drawY({ k, fam: d.fam, role: d.role, x: 0, y: 0, r: d.r, ph: i, age: 2, vx: 0, vy: 1, hp: 1, maxhp: 1, side: -1, gi: 0, dive: false }, t, 0, 400); ctx.restore();
          text(d.name, x, y + 46, 13, d.role === 'mini' ? '#e0a040' : '#ddd'); });
        ['choir', 'hollow', 'mother'].forEach((k, i) => { const d = YB[k], x = 240 + i * 400, y = 590;
          ctx.save(); ctx.translate(x, y); ctx.scale(0.62, 0.62); const e = { k, fam: d.fam, role: d.role, x: 0, y: 0, r: d.r, ph: i, age: 2, vx: 0, vy: 1, hp: 1, maxhp: 1, orbA: t };
          drawY(e, t, 0, 500); if (k === 'choir') drawChoirOrbs(e, t); ctx.restore(); text(d.name, x, y + 86, 14, '#ff9a9a', 'center', 'bold'); });
      } else {
        Object.keys(MT).forEach((k, i) => { const m = figureMatter(k), x = 80 + (i % 8) * 160, y = 86 + Math.floor(i / 8) * 118, sc = Math.min(1, 84 / Math.max(m.h || 0, (m.r || 0) * 2, 1), 140 / Math.max(m.w || 0, 1));
          m.x = 0; m.y = 0; ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); drawMatter(m, t); ctx.restore(); text(MT[k].name, x, y + 50, 13, '#ddd'); });
        const forms = [['blob', '#b9a6ff', 'Shapeless']].concat(NIDS.map(n => [BASE[n].form, BASE[n].color, `${BASE[n].formName} (${BASE[n].name})`]));
        forms.forEach(([fm, c, n], i) => { const x = 80 + (i % 8) * 160, y = 470 + Math.floor(i / 8) * 130; drawForm(fm, x, y, c, t, 1.3); text(n, x, y + 54, 13, '#ddd'); });
      }
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space') || mouse.click) { if (meta.innate) openAltar(); else { reset(); scene = 'play'; } } },
    draw() {
      const t = state.t; drawBackdrop(t, false);
      ctx.fillStyle = 'rgba(2,1,8,0.55)'; ctx.fillRect(0, 0, W, H);
      drawForm(meta.innate ? BASE[meta.innate].form : 'blob', W / 2, 140, meta.innate ? BASE[meta.innate].color : '#b9a6ff', t, 2.2);
      ctx.save(); ctx.shadowColor = '#8f6bff'; ctx.shadowBlur = CHEAP ? 0 : 20; text(TITLE, W / 2, 240, 72, '#efe6ff', 'center', 'bold'); ctx.restore();
      text('Hold the rift. Your deck of sins and virtues is your ammo.', W / 2, 292, 20, '#b8acd6');
      CONTROLS.forEach((c, i) => text(c, W / 2, 350 + i * 34, 19, '#cfc6e6'));
      NIDS.forEach((n, i) => { const x = W / 2 - 400 + (i % 7) * 120, y = 512 + Math.floor(i / 7) * 34, got = meta.discovered.includes(n); sigil(n, x - 14, y, 9, got ? BASE[n].color : '#4a4060'); text(got ? BASE[n].name : '?', x, y, 16, got ? BASE[n].color : '#6d6488', 'left'); });
      text(meta.innate ? `Natures ${meta.discovered.length}/14  ·  Fusions ${meta.fusions.length}/${FUSION_KEYS.length}  ·  ${meta.bank} void energy banked` : 'Fourteen innate natures wait in the void.', W / 2, 604, 16, '#9d92bb');
      text(meta.innate ? 'Enter or click: to the Rift Altar' : 'Enter or click to begin', W / 2, 656, 24, '#fff', 'center', 'bold');
    },
  },
  play: { update(dt) { if (pressed('KeyP') || pressed('Escape') || pressed('Space')) { scene = 'pause'; return; } updatePlay(dt); }, draw() { drawPlay(); } },
  altar: { update(dt) { updateAltar(dt); }, draw() { drawAltar(); } },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Space')) scene = 'play'; },
    draw() { drawPlay(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(RL, 0, RR - RL, H); text('PAUSED', RCX, H / 2, 48, '#fff', 'center', 'bold'); },
  },
  over: { update() { if (pressed('Enter') || pressed('KeyR') || mouse.click) openAltar(); }, draw() { drawPlay(); drawEnd(false); } },
  results: { update() { if (pressed('Enter') || pressed('KeyR') || mouse.click) openAltar(); }, draw() { drawPlay(); drawEnd(true); } },
};

// ---- Loop ----------------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); mouse.click = null;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; drawFrame();
}
function drawFrame() { ctx.setTransform(VIEW_R, 0, 0, VIEW_R, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get meta() { return meta; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

meta = loadMeta();
reset();
scene = params.get('scene') || 'title';
if (params.get('stage') && meta.innate) { state.stage = Number(params.get('stage')); state.waveN = Number(params.get('wave')) || 1; for (const k of [...MINIONS, ...MATTERS]) if (canMeet(k) && (YB[k] ? YB[k].from : MT[k].from) < state.stage) state.met.add(k); } // a check can start later in the run
if (params.get('autofire') === '1') state.autoFire = true;
if (scene === 'altar') openAltar();
if (params.get('tab')) altar.tab = params.get('tab');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>

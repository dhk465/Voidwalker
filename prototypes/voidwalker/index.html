  canvas { display: block; margin: 0 auto; cursor: crosshair; }

<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// Voidwalker: a blob of void holds the bottom of a rift; its deck of nature cards is its ammo.
// Between adventures, at the Rift Altar, the collection grows (Void Rite), cards fuse (Forge),
// and the next deck is chosen for the omen ahead.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value });
const STEP = 1 / 60;
const W = 1280, H = 720;
const PIXEL = false;
const FONT = '"Trebuchet MS", "Segoe UI", sans-serif';
const TITLE = 'Voidwalker';
const CONTROLS = ['WASD or Arrows: move along the rift floor', 'Mouse: aim  ·  hold left button: fire',
  'Q: auto-fire on or off', 'Space or P: pause  ·  M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 };
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = [];

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_R = 1;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  const r = k * (devicePixelRatio || 1); VIEW_R = r;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * k) + 'px'; canvas.style.height = Math.round(H * k) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * k) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = '') {
  ctx.fillStyle = c; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function wrapText(s, x, y, maxW, size, c, align = 'center') {
  ctx.font = `${size}px ${FONT}`; const words = String(s).split(' '); let line = '', yy = y;
  for (const wd of words) { const tst = line ? line + ' ' + wd : wd; if (ctx.measureText(tst).width > maxW && line) { text(line, x, yy, size, c, align); line = wd; yy += size + 4; ctx.font = `${size}px ${FONT}`; } else line = tst; }
  if (line) text(line, x, yy, size, c, align);
  return yy;
}

// ---- Input ------------------------------------------------------------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
const held = (...codes) => codes.some(c => down.has(c));
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
const mouse = { x: W / 2, y: 0, down: false, moved: false, click: null };
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointermove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.moved = true; });
canvas.addEventListener('pointerdown', e => { startAudio(); const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; if (e.button === 0) { mouse.down = true; mouse.click = p; } });
addEventListener('pointerup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { down.clear(); mouse.down = false; });
const inBox = (p, x, y, w, h) => !!p && p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;

// ---- Audio --------------------------------------------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}

// ---- Natures, recipes, cards -----------------------------------------------------------------
const BASE = NATURES.base, RECIPES = NATURES.recipes, DISCOVER = NATURES.discover, OMENS = NATURES.omens;
const NIDS = Object.keys(BASE);
const FUSION_KEYS = Object.keys(RECIPES).filter(k => k.split('+').length === 2);
function hexMix(a, b) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round((v + y[i]) / 2).toString(16).padStart(2, '0')).join('');
}
for (const [k, r] of Object.entries(RECIPES)) { // a base takes its nature's colour, a fusion blends its two
  if (r.color) continue;
  const ns = k.split('+'); r.color = ns.length === 1 ? BASE[ns[0]].color : ns.slice(1).reduce((c, n) => hexMix(c, BASE[n].color), BASE[ns[0]].color);
}
const keyOf = natures => [...natures].sort().join('+');
const hasOpposite = ns => ns.some(n => ns.includes(BASE[n].opposite));
const stackKey = (natures, level) => keyOf(natures) + '|' + level;
function parseStack(sk) { const [k, l] = sk.split('|'); return { natures: k ? k.split('+') : [], level: Number(l), key: k }; }
const recipeOf = c => RECIPES[keyOf(c.natures)];
const cardColor = c => (recipeOf(c) || { color: '#fff' }).color;
const roman = n => n <= 1 ? '' : ([, , ' II', ' III', ' IV', ' V', ' VI'][n] || ' ' + n);
const cardName = c => ((recipeOf(c) || { name: 'Unstable' }).name) + roman(c.level);
const isFusionKey = k => FUSION_KEYS.includes(k);
// Fusing: the union of natures. An opposite pair anywhere is void; twins level up; an unknown set is unstable.
function fuseResult(a, b) {
  const union = [...new Set([...a.natures, ...b.natures])].sort();
  if (hasOpposite(union)) return { kind: 'void', union };
  if (keyOf(a.natures) === keyOf(b.natures)) {
    if (Math.max(a.level, b.level) >= tune.max_level) return { kind: 'maxed', union };
    return { kind: 'level', union, level: Math.max(a.level, b.level) + 1 };
  }
  if (!RECIPES[keyOf(union)]) return { kind: 'unstable', union };
  return { kind: 'new', union, level: Math.max(a.level, b.level) };
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---- The save: the collection, kept between adventures ---------------------------------------
const SAVE_KEY = 'voidwalker.save.v1';
const NOSAVE = params.get('nosave') === '1' || navigator.webdriver; // a check never reads or writes a player's save
function freshMeta() {
  return { v: 1, innate: null, discovered: [], cards: {}, loadout: {}, fusions: [], stats: {}, bank: 0,
    runs: 0, wins: 0, depth: 0, maxDepth: 0, pity: 0, draws: 0, omen: 'calm', focus: null, seen: {} };
}
function demoMeta() { // ?demo=1: a collection part-way through, for looking at the Altar
  const m = freshMeta();
  m.innate = 'wrath'; m.discovered = ['wrath', 'greed', 'envy', 'charity', 'sloth', 'temperance', 'diligence'];
  m.cards = { '|1': 4, 'wrath|1': 3, 'wrath|2': 1, 'greed|1': 2, 'envy|1': 2, 'charity|1': 2, 'sloth|1': 1, 'temperance|1': 2, 'diligence|1': 1, 'greed+wrath|1': 1, 'envy+wrath|1': 1, 'charity+diligence|1': 1 };
  m.loadout = { '|1': 2, 'wrath|1': 3, 'wrath|2': 1, 'greed+wrath|1': 1, 'envy|1': 2 };
  m.fusions = ['greed+wrath', 'envy+wrath', 'charity+diligence', 'envy+sloth'];
  m.stats = { kills: 52, motes: 410, asteroids: 5, ricochets: 10, pods: 14, feeders: 6, debris: 8 };
  m.bank = 340; m.runs = 4; m.wins = 1; m.maxDepth = 1; m.omen = 'rockfall'; m.focus = 'wrath'; m.pity = 6;
  for (const k in m.cards) m.seen[k] = true;
  return m;
}
let meta;
function loadMeta() {
  if (params.get('demo') === '1') return demoMeta();
  if (NOSAVE) return freshMeta();
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 1) return Object.assign(freshMeta(), s); } catch (e) { /* no save */ }
  return freshMeta();
}
function saveMeta() { if (NOSAVE || params.get('demo') === '1') return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) { /* storage off */ } }
const owned = sk => meta.cards[sk] || 0;
function addCards(sk, n = 1) { meta.cards[sk] = owned(sk) + n; }
function takeCard(sk) { meta.cards[sk]--; if (meta.cards[sk] <= 0) delete meta.cards[sk]; if ((meta.loadout[sk] || 0) > owned(sk)) { meta.loadout[sk] = owned(sk); if (!meta.loadout[sk]) delete meta.loadout[sk]; } }
const deckCount = () => Object.values(meta.loadout).reduce((a, b) => a + b, 0);
function stacks(map) {
  return Object.entries(map).filter(([, n]) => n > 0).map(([sk, n]) => ({ sk, n, ...parseStack(sk) }))
    .sort((a, b) => a.natures.length - b.natures.length || (a.key > b.key ? 1 : a.key < b.key ? -1 : 0) || a.level - b.level);
}
function dominantNature(cards) {
  const count = {}; for (const n of NIDS) count[n] = 0;
  for (const c of cards) for (const n of c.natures) count[n] += c.level;
  let best = null, bestN = 0;
  for (const n of NIDS) if (count[n] > bestN || (count[n] === bestN && bestN > 0 && n === meta.innate)) { best = n; bestN = count[n]; }
  return best;
}
const loadoutCards = () => stacks(meta.loadout).flatMap(s => Array.from({ length: s.n }, () => ({ natures: s.natures, level: s.level })));
function formTraits(n) {
  const t = { damage: 1, max_energy: 0, magnet: 0, mote_bonus: 0, fire_rate: 1, bite: 0, bounces: 0, status: 1, contact_charm: 0,
    speed: 1, aura: 0, armor: 0, wave_heal: 0, iframes: 0, quick_shuffle: 0, regen: 0, leak_guard: 0, glob_dodge: 0, band: 0 };
  if (n) Object.assign(t, BASE[n].trait);
  return t;
}

// ---- The adventure's state ---------------------------------------------------------------------
const RL = 340, RR = 940, RCX = (RL + RR) / 2, PR = 18;
let scene, state;
function reset() { // a new adventure from the loadout (or, the first time, the firefly's crack of light)
  seed = Number(params.get('seed')) || (CONFIG.seed + meta.runs * 7919);
  const intro = !meta.innate;
  const omen = OMENS[intro ? 'calm' : meta.omen] || OMENS.calm;
  const deck = intro ? [] : loadoutCards();
  const form = intro ? null : dominantNature(deck);
  const tr = formTraits(form);
  state = {
    t: 0, score: 0, gained: '', phase: intro ? 'intro' : 'start', introT: 0, startT: 1.2,
    omen, depth: intro ? 0 : meta.depth, form, tr,
    statusMul: tr.status * (omen.status || 1),
    voidMul: (omen.void || 1) * (1 + tune.depth_void * (intro ? 0 : meta.depth)),
    hpMul: (omen.hp || 1) * (1 + tune.depth_hp * (intro ? 0 : meta.depth)),
    player: { x: RCX, y: 670, iframe: 0, aim: -Math.PI / 2, still: true },
    maxEnergy: tune.max_energy + tr.max_energy, energy: tune.max_energy + tr.max_energy, voidE: 0, kills: 0, ward: 0,
    deck: [], draw: [], discard: [], fireCd: 0, reshuffleT: 0, autoFire: false, nextId: 1,
    stage: 1, waveN: 1, wave: null, clearT: 0, waveHurt: false, waveLeak: false,
    enemies: [], matter: [], bolts: [], globs: [], motes: [], petals: [], fields: [], parts: [], floaters: [],
    walls: [], decoys: [], allies: [], meteors: [], mines: [], beams: [], arcs: [], echoes: [],
    timewarp: 0, frenzy: 0, magnetT: 0, leechAcc: 0, recentKills: [],
    shake: 0, leakFlash: 0, mother: null, found: [], banked: 0, won: false,
  };
  for (const c of deck) state.deck.push({ id: state.nextId++, natures: c.natures, level: c.level });
  if (!intro) { floatText(omen.name, RCX, 260, '#e9dcff', 30, 2.4); floatText(omen.says, RCX, 300, '#b8acd6', 17, 2.4); }
}
const cardById = id => state.deck.find(c => c.id === id);
function rebuildPiles() { state.draw = shuffle(state.deck.map(c => c.id)); state.discard = []; }

// ---- Discoveries: achievements kept between adventures ------------------------------------------
function track(stat, n = 1) {
  meta.stats[stat] = (meta.stats[stat] || 0) + n;
  for (const [nat, d] of Object.entries(DISCOVER)) {
    if (d.stat !== stat || meta.discovered.includes(nat) || !meta.innate) continue;
    if (meta.stats[stat] >= d.n) discover(nat);
  }
}
function discover(nat) {
  meta.discovered.push(nat);
  addCards(stackKey([nat], 1), tune.discovery_copies);
  meta.bank += tune.discovery_bonus;
  if (state) state.found.push(nat);
  saveMeta();
  floatText(`Discovered ${BASE[nat].name}!`, RCX, 210, BASE[nat].color, 30, 3.2);
  floatText(`${tune.discovery_copies} cards join your collection at the Altar  ·  +${tune.discovery_bonus} void`, RCX, 246, '#e9dcff', 15, 3.2);
  tone(392, 0.25, 'sine', 0.2); tone(588, 0.5, 'sine', 0.15, 1.5);
  events.push({ type: 'discover', nature: nat });
}

// ---- Waves -------------------------------------------------------------------------------------------
function makeWave(s, w) {
  const o = state.omen;
  if (s === 1 && w === 1) { // the first minute, by hand
    const l = [{ t: 0.6, k: 'asteroid', x: 560 }, { t: 1.6, k: 'pod', x: 520 }, { t: 2.6, k: 'pod', x: 760 }, { t: 3.6, k: 'pod', x: 640 },
      { t: 9, k: 'pod', x: 450 }, { t: 11, k: 'pod', x: 830 }, { t: 13, k: 'asteroid', x: 720 }, { t: 18, k: 'pod', x: 500 }, { t: 21, k: 'pod', x: 780 },
      { t: 27, k: 'slab', x: 640 }, { t: 28.4, k: 'grazer', x: 600 }, { t: 29, k: 'grazer', x: 680 }, { t: 29.6, k: 'grazer', x: 640 },
      { t: 34, k: 'pod', x: 560 }, { t: 35, k: 'pod', x: 720 }];
    if (o.rocks) l.push({ t: 6, k: 'asteroid', x: 450 }, { t: 16, k: 'asteroid', x: 820 });
    if (o.ruinsEarly) l.push({ t: 20, k: 'ruin', x: 640 });
    if (o.pods) l.push({ t: 5, k: 'pod', x: 600 }, { t: 14, k: 'pod', x: 700 }, { t: 24, k: 'pod', x: 460 });
    return l.sort((a, b) => a.t - b.t);
  }
  if (s === 3 && w === 3) return [{ t: 1, k: 'mother', x: RCX }];
  const pool = [['pod', 3 * (o.pods || 1)], ['grazer', 2.5], ['asteroid', 2 * (o.rocks || 1)], ['debris', 1.2]];
  if (s > 1 || w >= 2) pool.push(['feeder', 1.6], ['bigasteroid', 1 * (o.rocks || 1)]);
  if (s >= 2 || o.ruinsEarly) pool.push(['ruin', 0.9]);
  const count = tune.wave_base_count + (w - 1) * tune.wave_count_step + (s - 1) * tune.stage_count_step;
  const dur = 22 + 4 * w + 3 * s, total = pool.reduce((a, p) => a + p[1], 0), list = [];
  for (let i = 0; i < count; i++) {
    let r = rng() * total, k = pool[0][0];
    for (const [name, wt] of pool) { r -= wt; if (r <= 0) { k = name; break; } }
    list.push({ t: 1 + (i / count) * dur + rng() * 1.5, k, x: RL + 50 + rng() * (RR - RL - 100) });
  }
  if (s === 1 && w === 2) list.push({ t: 4, k: 'feeder', x: 480 }, { t: 6, k: 'feeder', x: 800 }, { t: 9, k: 'bigasteroid', x: 640 });
  if (s === 2 && w === 1) list.push({ t: 3, k: 'ruin', x: 560 }, { t: 12, k: 'ruin', x: 740 });
  return list.sort((a, b) => a.t - b.t);
}
function startWave() {
  state.wave = { list: makeWave(state.stage, state.waveN), idx: 0, t: 0 };
  state.phase = 'wave'; state.waveHurt = false; state.waveLeak = false; rebuildPiles();
  floatText(`Stage ${state.stage}  ·  Wave ${state.waveN}`, RCX, 340, '#e9dcff', 26, 2);
  events.push({ type: 'wave', stage: state.stage, wave: state.waveN });
}
const hpScale = () => (1 + tune.stage_hp_scale * (state.stage - 1)) * state.hpMul;
const spScale = () => 1 + tune.stage_speed_scale * (state.stage - 1);
function spawn(k, x, y = -50) {
  const base = { x, y, vx: 0, vy: 0, flash: 0, ph: rng() * 6.28, age: 0 };
  const E = o => { o.maxhp = o.hp; state.enemies.push(o); return o; };
  if (k === 'pod') E({ ...base, k, r: 15, hp: tune.pod_hp * hpScale(), vy: tune.pod_speed * spScale(), vx: (rng() - 0.5) * 20, drop: 2 });
  else if (k === 'grazer') E({ ...base, k, r: 15, hp: tune.grazer_hp * hpScale(), vy: tune.grazer_speed * spScale(), dive: false, drop: 3 });
  else if (k === 'feeder') E({ ...base, k, r: 22, hp: tune.feeder_hp * hpScale(), vy: tune.feeder_speed * spScale(), stopY: 150 + rng() * 110, spit: 1 + rng(), drop: 5 });
  else if (k === 'mother') {
    state.mother = E({ ...base, k, r: 66, y: -90, hp: tune.mother_hp * state.hpMul, spawnT: 2, spreadT: 3, debrisT: 6, drop: 30 });
    floatText('The Mother descends', RCX, 300, '#d9a7ff', 30, 2.5); tone(70, 1.4, 'sawtooth', 0.25, 0.5);
  } else if (k === 'asteroid' || k === 'bigasteroid' || k === 'chunk') {
    const big = k === 'bigasteroid', chunk = k === 'chunk', r = big ? 42 : chunk ? 20 : 26;
    const n = 9 + Math.floor(rng() * 4), verts = []; for (let i = 0; i < n; i++) verts.push(r * (0.72 + rng() * 0.3));
    const hp = (big ? tune.big_asteroid_hp : chunk ? tune.asteroid_hp * 0.6 : tune.asteroid_hp) * hpScale();
    state.matter.push({ ...base, k: 'asteroid', big, r, verts, hp, maxhp: hp, rot: rng() * 6, spin: (rng() - 0.5) * 0.8,
      vy: tune.asteroid_speed * (0.8 + rng() * 0.4) * spScale(), vx: (rng() - 0.5) * 16, drop: (big ? 5 : chunk ? 1 : 3) * (state.omen.rockVoid || 1) });
  } else if (k === 'debris' || k === 'slab') {
    const slab = k === 'slab', hp = tune.debris_hp * hpScale() * (slab ? 2 : 1);
    state.matter.push({ ...base, k: 'debris', rect: true, w: slab ? 150 : 78, h: slab ? 22 : 16, a: slab ? 0 : rng() * 3, spin: slab ? 0.05 : (rng() - 0.5) * 1.6,
      hp, maxhp: hp, vy: slab ? 40 : tune.debris_speed * spScale(), vx: slab ? 0 : (rng() - 0.5) * 60, drop: 2, r: slab ? 75 : 40 });
  } else if (k === 'ruin') {
    const hp = tune.ruin_hp * hpScale();
    state.matter.push({ ...base, k: 'ruin', rect: true, w: 150, h: 46, a: (rng() - 0.5) * 0.2, spin: 0, hp, maxhp: hp, vy: tune.ruin_speed * spScale(), vx: 0,
      drop: 8 * (state.omen.ruinVoid || 1), r: 78, glyphs: Array.from({ length: 6 }, () => Math.floor(rng() * 5)) });
    spawn('pod', x - 30, y - 70); spawn('pod', x + 30, y - 80); // the ruin shields the brood behind it

}

// ---- Small effects ----------------------------------------------------------------------------------
function floatText(s, x, y, c, size = 18, life = 1) { state.floaters.push({ s, x, y, c, size, life, max: life }); }
function sparks(x, y, c, n = 6, sp = 160) {
  for (let i = 0; i < n; i++) { const a = rng() * 6.283, v = sp * (0.4 + rng() * 0.8); state.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + rng() * 0.3, max: 0.6, c }); }
}
function spawnMotes(x, y, n) {
  for (let i = 0; i < n; i++) { const a = rng() * 6.283, v = 60 + rng() * 120; state.motes.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, ph: rng() * 6 }); }
}
function hurt(n, why) {
  if (n <= 0) return;
  if (state.ward > 0) { state.ward--; floatText('Ward!', state.player.x, state.player.y - 40, '#fff0b0', 18, 0.8); tone(900, 0.15, 'sine', 0.12); return; }
  if (state.tr.armor) n = Math.max(1, n - state.tr.armor);
  state.energy -= n; state.waveHurt = true; state.shake = Math.min(12, state.shake + 4 + n * 2);
  tone(110, 0.25, 'sawtooth', 0.25, 0.5);
  floatText(`-${n} ${why}`, state.player.x, state.player.y - 40, '#ff8a8a', 16, 0.9);
}
function heal(n) { if (n > 0 && state.energy < state.maxEnergy) { state.energy = Math.min(state.maxEnergy, state.energy + n); floatText(`+${Math.round(n * 10) / 10}`, state.player.x + 20, state.player.y - 30, '#c8ffe8', 15, 0.7); } }

// ---- Damage and kills --------------------------------------------------------------------------------
const isEnemy = t => t.k === 'pod' || t.k === 'grazer' || t.k === 'feeder' || t.k === 'mother';

      const glow = r.rar === 'mythic' ? '#ffd27a' : r.rar === 'rare' ? '#9ad7ff' : null;
      if (glow) { ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = CHEAP ? 0 : 22; roundRect(x - 3, y - 3, w + 6, h + 6, 10); ctx.strokeStyle = glow; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
      drawCard(r, x, y, w, h, false, false, r.isNew ? { s: 'NEW', bg: '#ffd27a', c: '#1a1229' } : null); });
    msgY = altar.reveal.length > 5 ? 2000 : 600;
  } else if (altar.tab === 'forge') {
    text('THE FORGE', R, 160, 18, '#e9dcff', 'left', 'bold');
    wrapText('Two cards become one. New fusions fill the Codex and pay a bounty. Twins rise a level. Opposites annul: a way to thin your collection, with a little void energy back.', R, 188, 560, 15, '#cfc6e6', 'left');
    const sl = [altar.sel[0], altar.sel[1]];
    sl.forEach((sk, i) => { const x = R + i * 200; roundRect(x, 250, 120, 130, 8); ctx.strokeStyle = '#3b3350'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
      if (sk) drawCard(parseStack(sk), x, 250, 120, 130, false, true); else text('choose', x + 60, 315, 15, '#6d6488'); });
    text('+', R + 160, 315, 30, '#9d92bb'); text('=', R + 360, 315, 30, '#9d92bb');
    let sub = 'Choose two cards';
    if (altar.sel.length === 2) {
      const a = parseStack(sl[0]), b = parseStack(sl[1]), r = fuseResult(a, b);
      if (r.kind === 'void') { sub = 'Opposites: both return to the void'; ctx.save(); ctx.translate(R + 460, 315); ctx.beginPath(); for (let i = 0; i <= 14; i++) { const q = i / 14 * 6.283, rr = 34 + Math.sin(q * 3 + t * 3) * 4; ctx.lineTo(Math.cos(q) * rr, Math.sin(q) * rr); } ctx.fillStyle = '#000'; ctx.fill(); glowStroke('#b9a6ff', 14, 2); ctx.restore(); }
      else if (r.kind === 'new' && isFusionKey(keyOf(r.union)) && !meta.fusions.includes(keyOf(r.union))) { sub = 'An unknown fusion. Forge it to find out.'; roundRect(R + 400, 250, 120, 130, 8); ctx.fillStyle = '#0e0a18'; ctx.fill(); glowStroke(RECIPES[keyOf(r.union)].color, 16, 2); text('?', R + 460, 312, 48, '#efe6ff', 'center', 'bold'); }
      else if (r.kind === 'new' || r.kind === 'level') { const c = { natures: r.union, level: r.level || 1 }; drawCard(c, R + 400, 250, 120, 130, false, false); sub = `Becomes ${cardName(c)}`; }
      else sub = r.kind === 'maxed' ? 'Already at its highest level' : 'Unstable: not yet known';
    }
    abutton(R, 400, 560, 56, `Fuse: ${tune.fuse_cost} void energy`, sub, '#ffd27a', altar.sel.length === 2 && meta.bank >= tune.fuse_cost);
    abutton(R, 470, 270, 34, 'Clear the choice', '', '#9d92bb', altar.sel.length > 0);
    text(`Fusions found: ${meta.fusions.length} / ${FUSION_KEYS.length}`, R, 536, 16, '#e9dcff', 'left', 'bold');
    text('A Void Bolt melts into any nature card: a way to trim plain bolts.', R, 562, 14, '#9d92bb', 'left');
    text('Three- and four-nature fusions: not yet known', R, 586, 14, '#6d6488', 'left');
    msgY = 640;
  } else if (altar.tab === 'codex') {
    text(`THE CODEX   ${meta.fusions.length} / ${FUSION_KEYS.length} fusions`, R, 160, 18, '#e9dcff', 'left', 'bold');
    let hi = null;
    FUSION_KEYS.forEach((k, i) => { const x = R + (i % 12) * 46, y = 180 + Math.floor(i / 12) * 46, known = meta.fusions.includes(k), ns = k.split('+'), rec = RECIPES[k];
      roundRect(x, y, 40, 40, 6); ctx.fillStyle = known ? '#140f22' : '#0a0812'; ctx.fill(); ctx.strokeStyle = known ? rec.color : '#221b33'; ctx.lineWidth = known ? 1.6 : 1; ctx.stroke();
      const canMake = ns.every(n => meta.discovered.includes(n));
      if (known) cardSigil({ natures: ns, level: 1 }, x + 20, y + 20, 13); else text('?', x + 20, y + 21, 16, canMake ? '#7d7398' : '#3a3150', 'center', 'bold');
      if (inBox(mouse, x, y, 40, 40)) hi = { k, known, canMake }; });
    if (hi) { const rec = RECIPES[hi.k], ns = hi.k.split('+');
      text(hi.known ? rec.name : 'Unknown fusion', R, 524, 20, hi.known ? rec.color : '#9d92bb', 'left', 'bold');
      text(hi.known ? `${BASE[ns[0]].name} + ${BASE[ns[1]].name}` : hi.canMake ? 'You know both of its natures. Try the Forge.' : 'One of its natures is still undiscovered.', R, 550, 15, '#cfc6e6', 'left');
      if (hi.known) wrapText(rec.says, R, 574, 560, 15, '#cfc6e6', 'left'); }
    else text('Point at a cell to read it. A brighter ? can be forged with natures you know.', R, 540, 15, '#8f84ad', 'left');
    text('Opposites never fuse: Pride and Humility, Greed and Charity, Wrath and Patience,', R, 622, 14, '#b9a6ff', 'left');
    text('Envy and Kindness, Lust and Chastity, Gluttony and Temperance, Sloth and Diligence.', R, 642, 14, '#b9a6ff', 'left');
    msgY = 2000;
  } else if (altar.tab === 'found') {
    text(`DISCOVERIES   ${meta.discovered.length} / 14 natures`, R, 160, 18, '#e9dcff', 'left', 'bold');
    NIDS.forEach((n, i) => { const x = R + (i % 2) * 284, y = 200 + Math.floor(i / 2) * 64, b = BASE[n], got = meta.discovered.includes(n), d = DISCOVER[n];
      roundRect(x, y - 24, 274, 56, 8); ctx.fillStyle = got ? '#130e20' : '#0a0812'; ctx.fill(); ctx.strokeStyle = got ? b.color : '#2a2140'; ctx.lineWidth = 1; ctx.stroke();
      sigil(n, x + 22, y + 4, 12, got ? b.color : '#4a4060');
      text(got ? `${b.name}  ·  ${b.element}` : `${b.name}  ·  undiscovered`, x + 44, y - 8, 15, got ? b.color : '#8f84ad', 'left', 'bold');
      if (n === meta.innate) text(`your innate nature  ·  ${b.formName}`, x + 44, y + 14, 13, '#cfc6e6', 'left');
      else if (got) wrapText(`${b.formName}: ${b.traitText}`, x + 44, y + 10, 222, 12, '#9d92bb', 'left');
      else { const have = Math.min(d.n, meta.stats[d.stat] || 0); wrapText(`${d.text} (${have}/${d.n})`, x + 44, y + 12, 222, 12, '#b8acd6', 'left'); } });
    abutton(980, 664, 260, 34, 'Forget everything', '', '#ff9a9a', true);
    msgY = 2000; if (altar.msg.startsWith('Click again')) text(altar.msg, R, 681, 14, altar.msgC, 'left');
  }
  if (msgY < H) wrapText(altar.msg, R, msgY, 560, 14, altar.msgC, 'left');
}

// ---- Scenes ------------------------------------------------------------------------------------
function drawEnd(won) {
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(RL, 0, RR - RL, H);
  wrapText(state.gained, RCX, 170, 540, 30, won ? '#efe6ff' : '#ffb0b0');
  text(`Ybasogs slain: ${state.kills}   ·   Void energy gathered: ${state.voidE}`, RCX, 250, 18, '#ddd');
  text(`Banked: +${state.banked} void energy`, RCX, 284, 22, '#d8c8ff', 'center', 'bold');
  text(won ? `including +${tune.win_bonus} for the Mother` : `${Math.round(tune.loss_keep * 100)}% kept after a fall`, RCX, 312, 15, '#b8acd6');
  if (state.found.length) { text('Discovered:', RCX, 352, 18, '#e9dcff', 'center', 'bold'); state.found.forEach((n, i) => { const x = RCX + (i - (state.found.length - 1) / 2) * 120; sigil(n, x, 390, 14, BASE[n].color); text(BASE[n].name, x, 420, 16, BASE[n].color); }); }
  if (won && meta.maxDepth > state.depth) text(`Depth ${state.depth + 1} is open to you.`, RCX, 462, 18, '#ffd27a', 'center', 'bold');
  text(`Next omen: ${(OMENS[meta.omen] || OMENS.calm).name}`, RCX, 500, 16, '#b8acd6');
  text('Enter or click: return to the Rift Altar', RCX, 566, 22, '#fff', 'center', 'bold');
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#000'); const t = state.t;
      text('Voidwalker: every figure', W / 2, 24, 22, '#e9dcff', 'center', 'bold');
      [['Pod', e => drawPod(e, t)], ['Grazer', e => drawGrazer(e, t)], ['Feeder', e => drawFeeder(e, t)], ['Glob', e => drawGlob(e)], ['Firefly', e => drawFirefly(e.x, e.y, t)]]
        .forEach(([n, fn], i) => { const x = 110 + i * 130, y = 110; fn({ x, y, r: n === 'Feeder' ? 22 : 15, ph: i, age: 2, vx: 0, vy: 1, dive: false }); text(n, x, y + 58, 15, '#ddd'); });
      drawMother({ x: 1100, y: 130, r: 66, ph: 0 }, t, 1100, 400); text('The Mother', 1100, 252, 15, '#ddd');
      drawAsteroid({ x: 110, y: 290, r: 26, rot: 0.3, verts: [24, 22, 26, 20, 25, 23, 21, 26, 22, 24] }); text('Asteroid', 110, 340, 15, '#ddd');
      drawAsteroid({ x: 250, y: 290, r: 42, rot: 1, verts: [40, 36, 42, 33, 39, 41, 35, 40, 37, 42, 38] }); text('Big asteroid', 250, 350, 15, '#ddd');
      drawDebris({ x: 410, y: 290, w: 78, h: 16, a: 0.4 }); text('Space debris', 410, 340, 15, '#ddd');
      drawRuin({ x: 600, y: 290, w: 150, h: 46, a: 0, ph: 0, glyphs: [0, 1, 2, 3, 4, 1] }, t); text('Ruin', 600, 340, 15, '#ddd');
      drawCrack(760, 290, t); text('Crack of light', 760, 340, 15, '#ddd');
      const forms = [['blob', '#b9a6ff', 'Shapeless']].concat(NIDS.map(n => [BASE[n].form, BASE[n].color, `${BASE[n].formName} (${BASE[n].name})`]));
      forms.forEach(([fm, c, n], i) => { const x = 90 + (i % 8) * 156, y = 440 + Math.floor(i / 8) * 150; drawForm(fm, x, y, c, t, 1.5); text(n, x, y + 62, 14, '#ddd'); });
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space') || mouse.click) { if (meta.innate) openAltar(); else { reset(); scene = 'play'; } } },
    draw() {
      const t = state.t; drawBackdrop(t, false);
      ctx.fillStyle = 'rgba(2,1,8,0.55)'; ctx.fillRect(0, 0, W, H);
      drawForm(meta.innate ? BASE[meta.innate].form : 'blob', W / 2, 140, meta.innate ? BASE[meta.innate].color : '#b9a6ff', t, 2.2);
      ctx.save(); ctx.shadowColor = '#8f6bff'; ctx.shadowBlur = CHEAP ? 0 : 20; text(TITLE, W / 2, 240, 72, '#efe6ff', 'center', 'bold'); ctx.restore();
      text('Hold the rift. Your deck of sins and virtues is your ammo.', W / 2, 292, 20, '#b8acd6');
      CONTROLS.forEach((c, i) => text(c, W / 2, 350 + i * 34, 19, '#cfc6e6'));
      NIDS.forEach((n, i) => { const x = W / 2 - 400 + (i % 7) * 120, y = 512 + Math.floor(i / 7) * 34, got = meta.discovered.includes(n); sigil(n, x - 14, y, 9, got ? BASE[n].color : '#4a4060'); text(got ? BASE[n].name : '?', x, y, 16, got ? BASE[n].color : '#6d6488', 'left'); });
      text(meta.innate ? `Natures ${meta.discovered.length}/14  ·  Fusions ${meta.fusions.length}/${FUSION_KEYS.length}  ·  ${meta.bank} void energy banked` : 'Fourteen innate natures wait in the void.', W / 2, 604, 16, '#9d92bb');
      text(meta.innate ? 'Enter or click: to the Rift Altar' : 'Enter or click to begin', W / 2, 656, 24, '#fff', 'center', 'bold');
    },
  },
  play: { update(dt) { if (pressed('KeyP') || pressed('Escape') || pressed('Space')) { scene = 'pause'; return; } updatePlay(dt); }, draw() { drawPlay(); } },
  altar: { update(dt) { updateAltar(dt); }, draw() { drawAltar(); } },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Space')) scene = 'play'; },
    draw() { drawPlay(); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(RL, 0, RR - RL, H); text('Paused', RCX, H / 2 - 20, 48, '#fff', 'center', 'bold'); text('Space or P to resume', RCX, H / 2 + 30, 20, '#ccc'); },
  },
  over: { update() { if (pressed('Enter') || pressed('KeyR') || mouse.click) openAltar(); }, draw() { drawPlay(); drawEnd(false); } },
  results: { update() { if (pressed('Enter') || pressed('KeyR') || mouse.click) openAltar(); }, draw() { drawPlay(); drawEnd(true); } },
};

// ---- Loop ----------------------------------------------------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); mouse.click = null;
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; drawFrame();
}
function drawFrame() { ctx.setTransform(VIEW_R, 0, 0, VIEW_R, 0, 0); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  get meta() { return meta; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) { for (let i = 0; i < n; i++) step(); if (draw) { ALPHA = alpha; drawFrame(); } },
};

meta = loadMeta();
reset();
scene = params.get('scene') || 'title';
if (scene === 'altar') openAltar();
if (params.get('tab')) altar.tab = params.get('tab');
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
</body>
</html>

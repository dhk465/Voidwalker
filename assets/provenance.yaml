# Where each file in assets/ came from, one entry per file or folder of like files (the Godot build's assets).
- path: assets/sprites/lobby/*.png
  origin: code
  tool: "tools/art/gen_lobby.py --scale 0.5 (pixel shader + hand-placed detail) -> PixelSpec -> codeart2d render_pixelspec.py --strict-qc -> tools/art/pack_lobby.py (3 px margin); code-drawn, no image model"
  model: "claude-opus-5-5"
  date: 2026-11-19
  ships: true
- path: assets/sprites/lobby/lobby-sprites.json
  origin: code
  tool: "tools/art/pack_lobby.py: sizes and anchors of the lobby sprites"
  date: 2026-11-19
  ships: true
- path: assets/art-src/lobby/*.pixelspec.json
  origin: code
  tool: "PixelSpec sources written by tools/art/gen_lobby.py --scale 0.5"
  model: "claude-opus-5-5"
  date: 2026-11-19
  ships: false
